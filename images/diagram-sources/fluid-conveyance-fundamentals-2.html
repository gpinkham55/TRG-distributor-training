<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{display:block;font-family:Inter,Arial,sans-serif}
.h{font-size:20px;font-weight:700;letter-spacing:3px;fill:#5b6170}
.lab{font-size:20px;fill:#5b6170}
.red{font-size:20px;font-weight:600;fill:#8b1e1e}
.grn{font-size:20px;font-weight:600;fill:#1f5c3a}
.big{font-size:32px;font-weight:700;fill:#111}
.sub{font-size:22px;fill:#4a5060}
.t{font-size:26px;font-weight:700;fill:#111}
.b{font-size:23px;font-weight:700;fill:#111}
.p{font-size:22px;fill:#4a5060}
</style></head><body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1730"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5c3a"/></marker>
</defs>
<text x="80" y="107" class="h">SIDE VIEW</text>
<text x="1330" y="107" class="h">END VIEW</text>
<line x1="1280" y1="135" x2="1280" y2="745" stroke="#c9ccd4" stroke-width="3"/>

<!-- hose -->
<rect x="300" y="418" width="720" height="44" fill="#2b2f38"/>
<!-- left elbow -->
<path d="M230,440 H190 Q146,440 146,396 V288" fill="none" stroke="#9aa1ae" stroke-width="32"/>
<rect x="114" y="230" width="64" height="58" rx="4" fill="#b4b9c4" stroke="#6f7686" stroke-width="2"/>
<line x1="114" y1="258" x2="178" y2="258" stroke="#6f7686" stroke-width="2"/>
<rect x="224" y="408" width="82" height="64" rx="5" fill="#a9afbb" stroke="#6f7686" stroke-width="2"/>
<g stroke="#6f7686" stroke-width="2"><line x1="240" y1="408" x2="240" y2="472"/><line x1="256" y1="408" x2="256" y2="472"/><line x1="272" y1="408" x2="272" y2="472"/><line x1="288" y1="408" x2="288" y2="472"/></g>
<!-- right elbow -->
<path d="M1090,440 H1130 Q1174,440 1174,396 V288" fill="none" stroke="#9aa1ae" stroke-width="32"/>
<rect x="1142" y="230" width="64" height="58" rx="4" fill="#b4b9c4" stroke="#6f7686" stroke-width="2"/>
<line x1="1142" y1="258" x2="1206" y2="258" stroke="#6f7686" stroke-width="2"/>
<rect x="1014" y="408" width="82" height="64" rx="5" fill="#a9afbb" stroke="#6f7686" stroke-width="2"/>
<g stroke="#6f7686" stroke-width="2"><line x1="1030" y1="408" x2="1030" y2="472"/><line x1="1046" y1="408" x2="1046" y2="472"/><line x1="1062" y1="408" x2="1062" y2="472"/><line x1="1078" y1="408" x2="1078" y2="472"/></g>
<!-- sealing faces -->
<line x1="112" y1="229" x2="180" y2="229" stroke="#1f5c3a" stroke-width="4"/>
<line x1="1140" y1="229" x2="1208" y2="229" stroke="#1f5c3a" stroke-width="4"/>
<line x1="188" y1="213" x2="240" y2="188" stroke="#1f5c3a" stroke-width="2"/>
<text x="248" y="188" class="grn">sealing face</text>
<!-- center lines -->
<line x1="146" y1="175" x2="146" y2="628" stroke="#8b1e1e" stroke-width="2.5" stroke-dasharray="9 7"/>
<line x1="1174" y1="175" x2="1174" y2="628" stroke="#8b1e1e" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="146" y="161" class="red" text-anchor="middle">center line</text>
<text x="1174" y="161" class="red" text-anchor="middle">center line</text>
<text x="265" y="508" class="lab" text-anchor="middle">ferrule</text>
<text x="1055" y="508" class="lab" text-anchor="middle">ferrule</text>
<!-- dimension -->
<line x1="150" y1="587" x2="1170" y2="587" stroke="#0f1730" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="660" y="637" class="big" text-anchor="middle">Overall length</text>
<text x="660" y="676" class="sub" text-anchor="middle">Measure to the center line of the sealing face on each elbow.</text>

<!-- end view -->
<text x="1427" y="212" class="lab" text-anchor="middle">far elbow, straight up</text>
<g fill="#9aa1ae"><rect x="1414" y="232" width="26" height="12"/><rect x="1414" y="254" width="26" height="12"/><rect x="1414" y="276" width="26" height="12"/><rect x="1414" y="298" width="26" height="12"/><rect x="1414" y="320" width="26" height="12"/><rect x="1414" y="342" width="26" height="12"/><rect x="1414" y="364" width="26" height="12"/></g>
<circle cx="1427" cy="440" r="62" fill="#2b2f38"/>
<rect x="1450" y="427" width="118" height="26" fill="#6f7686"/>
<circle cx="1427" cy="440" r="24" fill="#fff"/>
<path d="M1427,350 A90,90 0 0 1 1513,412" fill="none" stroke="#1f5c3a" stroke-width="4" marker-end="url(#ag)"/>
<text x="1500" y="340" style="font-size:34px;font-weight:700;fill:#1f5c3a">90°</text>
<text x="1533" y="488" class="lab" text-anchor="middle">near elbow</text>
<text x="1427" y="572" class="t" text-anchor="middle">Orientation</text>
<text x="1437" y="608" style="font-size:20px;fill:#4a5060" text-anchor="middle">Sight down the hose with</text>
<text x="1437" y="636" style="font-size:20px;fill:#4a5060" text-anchor="middle">the far elbow pointing</text>
<text x="1437" y="664" style="font-size:20px;fill:#4a5060" text-anchor="middle">straight up. Read the angle</text>
<text x="1437" y="692" style="font-size:20px;fill:#4a5060" text-anchor="middle">clockwise to the near elbow.</text>

<rect x="80" y="787" width="1440" height="153" rx="18" fill="#eef0f5"/>
<text x="120" y="835" class="b">Give the shop two numbers: the overall length and the angle.</text>
<text x="120" y="872" class="p">The shop works out the cut length from the overall length and the fitting dimensions.</text>
<text x="120" y="907" class="p">When a customer gives a length, ask whether it is the overall length or the hose alone.</text>
</svg></body></html>
