<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{display:block;font-family:Inter,Arial,sans-serif}
.h{font-size:20px;font-weight:700;letter-spacing:3px;fill:#5b6170}
.n{font-size:30px;font-weight:700;fill:#fff}
.t{font-size:28px;font-weight:700;fill:#111}
.p{font-size:22px;fill:#4a5060}
.g{font-size:22px;font-weight:600;fill:#1f5c3a}
.r{font-size:22px;font-weight:600;fill:#8b1e1e}
.b{font-size:23px;font-weight:700;fill:#111}
</style></head><body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
<text x="80" y="107" class="h">BEFORE YOU TIGHTEN A HYDRAULIC FITTING</text>

<g>
<rect x="80" y="140" width="700" height="290" rx="16" fill="#fff" stroke="#c9ccd4" stroke-width="2.5"/>
<circle cx="130" cy="192" r="26" fill="#2b2f38"/><text x="130" y="203" class="n" text-anchor="middle">1</text>
<text x="176" y="202" class="t">Confirm the thread type</text>
<text x="120" y="258" class="p">Identify the standard on both sides: thread, size,</text>
<text x="120" y="288" class="p">and how it seals.</text>
<text x="120" y="340" class="r">A fitting that binds after a few turns is the wrong match.</text>
<text x="120" y="378" class="r">Stop. Never force it.</text>
</g>

<g>
<rect x="820" y="140" width="700" height="290" rx="16" fill="#fff" stroke="#c9ccd4" stroke-width="2.5"/>
<circle cx="870" cy="192" r="26" fill="#2b2f38"/><text x="870" y="203" class="n" text-anchor="middle">2</text>
<text x="916" y="202" class="t">Keep one standard on both sides</text>
<text x="860" y="258" class="p">Pairs that look alike and do not seal to each other:</text>
<text x="860" y="306" class="r">JIC 37° and SAE 45°</text>
<text x="860" y="342" class="r">NPT and BSPT</text>
<text x="860" y="392" class="p">Sealant never makes a mismatched pair seal.</text>
</g>

<g>
<rect x="80" y="460" width="700" height="290" rx="16" fill="#fff" stroke="#c9ccd4" stroke-width="2.5"/>
<circle cx="130" cy="512" r="26" fill="#2b2f38"/><text x="130" y="523" class="n" text-anchor="middle">3</text>
<text x="176" y="522" class="t">Seal tapered pipe threads only</text>
<text x="120" y="578" class="g">Sealant or PTFE tape: NPT and BSPT.</text>
<text x="120" y="614" class="p">Keep tape off the first thread.</text>
<text x="120" y="666" class="r">No sealant or tape: O-ring and flare fittings</text>
<text x="120" y="702" class="r">(ORB, ORFS, JIC, SAE 45°, BSPP).</text>
</g>

<g>
<rect x="820" y="460" width="700" height="290" rx="16" fill="#fff" stroke="#c9ccd4" stroke-width="2.5"/>
<circle cx="870" cy="512" r="26" fill="#2b2f38"/><text x="870" y="523" class="n" text-anchor="middle">4</text>
<text x="916" y="522" class="t">Tighten to the maker's torque</text>
<text x="860" y="578" class="p">Inspect the sealing surfaces. Replace damaged</text>
<text x="860" y="608" class="p">O-rings and bonded washers.</text>
<text x="860" y="660" class="g">Use a calibrated torque tool.</text>
<text x="860" y="702" class="r">Never overtighten.</text>
</g>

<rect x="80" y="787" width="1440" height="153" rx="18" fill="#eef0f5"/>
<text x="120" y="835" class="b">Find how a fitting seals before you match it.</text>
<text x="120" y="872" class="p">Threads hold. The seal may be an O-ring, a cone, a ring, a washer, or the threads themselves.</text>
<text x="120" y="907" class="p">Loose sealant or tape on an O-ring or flare fitting can get into the hydraulic system.</text>
</svg></body></html>
