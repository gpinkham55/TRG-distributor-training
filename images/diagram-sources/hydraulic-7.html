<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{display:block;font-family:Inter,Arial,sans-serif}
.h{font-size:20px;font-weight:700;letter-spacing:3px;fill:#5b6170}
.lab{font-size:20px;fill:#5b6170}
.red{font-size:20px;font-weight:600;fill:#8b1e1e}
.ang{font-size:40px;font-weight:700;fill:#1f5c3a}
.t{font-size:30px;font-weight:700;fill:#111}
.sub{font-size:22px;fill:#4a5060}
.b{font-size:23px;font-weight:700;fill:#111}
.p{font-size:22px;fill:#4a5060}
</style></head><body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
<text x="80" y="107" class="h">MALE FLARE ENDS, SIDE VIEW</text>
<line x1="800" y1="235" x2="800" y2="740" stroke="#c9ccd4" stroke-width="3"/>

<!-- JIC 37: cone half-angle 37 from centerline. nose: tip radius 26 at x=640, base radius 86. length = (86-26)/tan37 = 79.6 -->
<g>
  <rect x="150" y="300" width="130" height="220" rx="6" fill="#b4b9c4" stroke="#6f7686" stroke-width="2"/>
  <line x1="150" y1="373" x2="280" y2="373" stroke="#6f7686" stroke-width="2"/><line x1="150" y1="447" x2="280" y2="447" stroke="#6f7686" stroke-width="2"/>
  <rect x="280" y="324" width="280" height="172" fill="#a9afbb" stroke="#6f7686" stroke-width="2"/>
  <g stroke="#6f7686" stroke-width="2"><line x1="300" y1="324" x2="300" y2="496"/><line x1="320" y1="324" x2="320" y2="496"/><line x1="340" y1="324" x2="340" y2="496"/><line x1="360" y1="324" x2="360" y2="496"/><line x1="380" y1="324" x2="380" y2="496"/><line x1="400" y1="324" x2="400" y2="496"/><line x1="420" y1="324" x2="420" y2="496"/><line x1="440" y1="324" x2="440" y2="496"/><line x1="460" y1="324" x2="460" y2="496"/><line x1="480" y1="324" x2="480" y2="496"/><line x1="500" y1="324" x2="500" y2="496"/><line x1="520" y1="324" x2="520" y2="496"/><line x1="540" y1="324" x2="540" y2="496"/></g>
  <polygon points="560,324 639.6,384 639.6,436 560,496" fill="#c5cad3" stroke="#6f7686" stroke-width="2"/>
  <line x1="560" y1="324" x2="639.6" y2="384" stroke="#1f5c3a" stroke-width="5"/>
  <line x1="110" y1="410" x2="740" y2="410" stroke="#8b1e1e" stroke-width="2.5" stroke-dasharray="9 7"/>
  <!-- angle: extend seat line to centerline: from (639.6,384) slope: continues to (674.1,410) -->
  <line x1="639.6" y1="384" x2="674.1" y2="410" stroke="#1f5c3a" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M604.1,410 A70,70 0 0 1 618.2,367.9" fill="none" stroke="#1f5c3a" stroke-width="4"/>
  <text x="560" y="290" class="ang">37°</text>
  <line x1="596" y1="300" x2="608" y2="372" stroke="#1f5c3a" stroke-width="2"/>
  <text x="430" y="560" class="lab" text-anchor="middle">straight thread, holds only</text>
  <text x="420" y="640" class="t" text-anchor="middle">JIC 37° flare</text>
  <text x="420" y="678" class="sub" text-anchor="middle">Hydraulic lines. Seals cone to seat.</text>
</g>

<!-- SAE 45: half-angle 45. length = 60 -->
<g transform="translate(790,0)">
  <rect x="150" y="300" width="130" height="220" rx="6" fill="#b4b9c4" stroke="#6f7686" stroke-width="2"/>
  <line x1="150" y1="373" x2="280" y2="373" stroke="#6f7686" stroke-width="2"/><line x1="150" y1="447" x2="280" y2="447" stroke="#6f7686" stroke-width="2"/>
  <rect x="280" y="324" width="280" height="172" fill="#a9afbb" stroke="#6f7686" stroke-width="2"/>
  <g stroke="#6f7686" stroke-width="2"><line x1="300" y1="324" x2="300" y2="496"/><line x1="320" y1="324" x2="320" y2="496"/><line x1="340" y1="324" x2="340" y2="496"/><line x1="360" y1="324" x2="360" y2="496"/><line x1="380" y1="324" x2="380" y2="496"/><line x1="400" y1="324" x2="400" y2="496"/><line x1="420" y1="324" x2="420" y2="496"/><line x1="440" y1="324" x2="440" y2="496"/><line x1="460" y1="324" x2="460" y2="496"/><line x1="480" y1="324" x2="480" y2="496"/><line x1="500" y1="324" x2="500" y2="496"/><line x1="520" y1="324" x2="520" y2="496"/><line x1="540" y1="324" x2="540" y2="496"/></g>
  <polygon points="560,324 620,384 620,436 560,496" fill="#c5cad3" stroke="#6f7686" stroke-width="2"/>
  <line x1="560" y1="324" x2="620" y2="384" stroke="#1f5c3a" stroke-width="5"/>
  <line x1="110" y1="410" x2="740" y2="410" stroke="#8b1e1e" stroke-width="2.5" stroke-dasharray="9 7"/>
  <line x1="620" y1="384" x2="646" y2="410" stroke="#1f5c3a" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M576,410 A70,70 0 0 1 596.5,360.5" fill="none" stroke="#1f5c3a" stroke-width="4"/>
  <text x="540" y="290" class="ang">45°</text>
  <line x1="576" y1="300" x2="586" y2="366" stroke="#1f5c3a" stroke-width="2"/>
  <text x="430" y="560" class="lab" text-anchor="middle">straight thread, holds only</text>
  <text x="420" y="640" class="t" text-anchor="middle">SAE 45° flare</text>
  <text x="420" y="678" class="sub" text-anchor="middle">Low-pressure fuel, oil, and refrigerant lines.</text>
</g>
<text x="112" y="396" class="red">center line</text>
<text x="902" y="396" class="red">center line</text>
<text x="80" y="170" class="sub">The seat angle is measured from the center line. The green line is the sealing seat.</text>

<rect x="80" y="787" width="1440" height="153" rx="18" fill="#eef0f5"/>
<text x="120" y="835" class="b">Never interchange JIC 37° and SAE 45°.</text>
<text x="120" y="872" class="p">Their threads match in some sizes, so a mismatched pair can screw together. The seat angles differ and the seal will not hold.</text>
<text x="120" y="907" class="p">Check the seat angle with a seat gauge before you match a flare fitting.</text>
</svg></body></html>
