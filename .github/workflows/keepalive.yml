name: Keep Supabase awake
# Free Supabase projects pause after a week with no activity. This pings the
# database every 3 days so it stays up.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(jq -r .supabaseUrl site.config.json)
          KEY=$(jq -r .supabaseAnonKey site.config.json)
          if [ -z "$KEY" ]; then echo "No anon key yet; skipping."; exit 0; fi
          curl -fsS "$URL/rest/v1/modules?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
